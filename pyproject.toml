[project]
name = "landolfio"
version = "0.1.0"
description = ""
authors = [{name = "Job Doesburg", email = "job.doesburg@gmail.com"}]
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "requests>=2.33.0",
    "json2html>=1.3.0",
    "django-queryable-properties>=1.13.0",
    "bleach>=6.4.0",
    "django-autocompletefilter>=0.0.9",
    "django-countries>=9.0.0",
    "django-localflavor>=5.1",
    "django-model-utils>=5.0.0",
    "django-storages[s3]>=1.14.4",
    "boto3>=1.43.67",
    "django-drf-filepond>=0.5.0",
    "django-admin-numeric-filter>=0.1.9",
    "django-easy-admin-object-actions>=1.1.0",
    "django-admin-multi-select-filter>=1.4.1",
    "django-reorder-admin>=0.3.1",
    "django-bootstrap5>=26.2",
    "django-scheduled-tasks>=0.3.0",
    "django-tasks-db>=0.12.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "coverage[toml]>=7.15.4",
    "django-debug-toolbar>=7.0.0",
    "django-coverage-plugin>=3.1.1",
    "pre-commit>=4.6.1",
    "pydocstyle[toml]>=6.3.0",
    "pylint>=4.0.6",
    "toml-sort>=0.24.2",
    "pylint-django>=2.8.0",
    "dj-inmemorystorage>=2.1.0",
]
prod = [
    "uwsgi>=2.0.28",
    "psycopg2-binary>=2.9.10",
    "sentry-sdk>=2.66.1",
]

[tool.black]
target-version = ["py312"]

[tool.pydocstyle]
add-ignore = "D200"

[tool.pylint]

[tool.pylint.format]
max-line-length = "88"

[tool.pylint.master]
load-plugins = ["pylint_django"]

[tool.pylint.messages_control]
disable = ""
